services:
  app1:
    image: load-balancer
    environment:
      - INSTANCE_ID=1
      - PORT=3000

  app2:
    image: load-balancer
    environment:
      - INSTANCE_ID=2
      - PORT=4000
  app3:
    image: load-balancer
    environment:
      - INSTANCE_ID=3
      - PORT=5000

  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
